<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__MENU_TITLE__ — Herd at Todenham Manor Farm</title>
<style>
  :root {
    --green: #2F5233;
    --text: #1a1a1a;
    --muted: #555;
    --rule: #b5c9b8;
    --font-heading: 'Courier New', Courier, monospace;
    --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: #fff;
    color: var(--text);
    font-size: 13px;
  }

  /* ── Screen-only print bar ───────────────────────────── */
  .print-bar {
    background: var(--green); color: #fff;
    padding: 12px 24px; display: flex;
    align-items: center; justify-content: space-between; font-size: 13px;
  }
  .print-bar span { opacity: 0.75; }
  .print-bar button {
    background: #fff; color: var(--green); border: none;
    padding: 7px 18px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* ── A4 page shell ───────────────────────────────────── */
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 20px auto;
    background: #fff;
    padding: 18mm 20mm 16mm;
    box-shadow: 0 4px 30px rgba(0,0,0,0.12);
    /* Flex column so footer is always pushed to the bottom */
    display: flex;
    flex-direction: column;
  }

  /* Content area grows to fill all available space */
  .page-content { flex: 1; }

  /* ── Header ──────────────────────────────────────────── */
  .header { text-align: center; margin-bottom: 6mm; }

  .brand-logo { display: block; width: 62mm; margin: 0 auto 5mm; }

  .tagline {
    font-family: var(--font-body); font-weight: 400; font-size: 8.5pt;
    color: var(--muted); text-align: center;
    max-width: 120mm; margin: 0 auto 8mm; line-height: 1.65;
  }

  /* ── Section rows (multi-column grouping) ────────────── */
  .section-row {
    display: flex;
    gap: 8mm;
    margin-bottom: 7mm;
    align-items: flex-start;  /* don't stretch short columns */
  }
  /* A section inside a row fills its fair share */
  .section-row .section { flex: 1; margin-bottom: 0; }

  /* ── Individual section ──────────────────────────────── */
  .section { margin-bottom: 7mm; page-break-inside: avoid; }

  .section-header {
    font-family: var(--font-heading); font-weight: 700; font-size: 12pt;
    letter-spacing: 0.1em; color: var(--text);
    text-transform: uppercase; margin-bottom: 2.5mm;
  }

  .section-rule {
    border: none; border-top: 1.5px solid var(--rule); margin-bottom: 2.5mm;
  }

  /* Italic subtitle under section header (e.g. "Teapigs Herbal Teas") */
  .section-subtitle {
    font-family: var(--font-body); font-size: 8pt;
    font-style: italic; color: var(--muted); margin-bottom: 3mm;
  }

  /* ── Item rows ───────────────────────────────────────── */
  .item {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 2mm; gap: 6px;
  }

  .item-name {
    font-family: var(--font-body); font-weight: 400; font-size: 10pt;
    color: var(--text); flex: 1; line-height: 1.4;
  }

  .item-price {
    font-family: var(--font-body); font-weight: 400; font-size: 10pt;
    color: var(--text); white-space: nowrap; flex-shrink: 0;
    min-width: 16px; text-align: right;
  }

  .item-note {
    font-family: var(--font-body); font-size: 8.5pt;
    color: var(--muted); font-style: italic;
    margin-top: 0.5mm; margin-bottom: 1.5mm;
  }

  /* ── Allergen indicators — simple italic, no background ─ */
  .item-allergens { display: inline; margin-left: 4px; }
  .item-allergen {
    font-family: var(--font-body); font-size: 7.5pt; font-style: italic;
    color: var(--muted); font-weight: 400;
  }

  /* ── Print title block (set menu heading etc.) ───────── */
  .menu-title {
    font-family: var(--font-heading); font-size: 15pt; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text); text-align: center; margin-bottom: 3mm;
  }
  .menu-intro {
    font-family: var(--font-body); font-size: 10pt; font-weight: 400;
    color: var(--muted); text-align: center; white-space: pre-line;
    line-height: 1.7; margin-bottom: 5mm;
  }

  /* ── Footer — always at bottom of page ──────────────── */
  .footer-area { margin-top: 6mm; }

  .footer-rule {
    border: none; border-top: 1.5px solid var(--rule); margin-bottom: 5mm;
  }

  .footer {
    font-family: var(--font-body); font-weight: 400; font-size: 8pt;
    color: var(--muted); text-align: center; line-height: 1.6; font-style: italic;
  }

  /* ── Multi-price columns ─────────────────────────────── */
  .price-header-row { display: flex; justify-content: flex-end; padding-bottom: 1mm; }
  .price-header-cell { width: 48px; text-align: right; font-size: 7.5pt; font-style: italic; color: var(--muted); }
  .price-header-cell.wide { width: 42px; }
  .item-price-group { display: flex; flex-shrink: 0; }
  .item-price-cell { width: 48px; text-align: right; font-size: 10pt; color: var(--text); white-space: nowrap; flex-shrink: 0; }
  .item-price-cell.wide { width: 42px; }

  /* ── Two-column page layout ──────────────────────────── */
  .page-content.two-col { -webkit-column-count: 2; column-count: 2; -webkit-column-gap: 8mm; column-gap: 8mm; }
  .page-content.two-col .section { page-break-inside: avoid; break-inside: avoid; }
  /* Header, print title and intro span both columns as a full-width masthead */
  .page-content.two-col .header,
  .page-content.two-col .menu-title,
  .page-content.two-col .menu-intro { -webkit-column-span: all; column-span: all; }

  /* ── Print media ─────────────────────────────────────── */
  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
    .print-bar { display: none; }
    .page {
      width: 210mm; height: 297mm;
      margin: 0; padding: 16mm 18mm 14mm;
      box-shadow: none; overflow: hidden;
    }
    /* Force columns to stay side-by-side in print regardless of page width */
    .section-row { display: flex; flex-direction: row; page-break-inside: avoid; }
    .section { page-break-inside: avoid; }
  }

  /* ── A5 page variant ─────────────────────────────────── */
  .page.a5 { width: 148mm; min-height: 210mm; padding: 12mm 14mm 10mm; }
  @media print {
    .page.a5 { width: 148mm; height: 210mm; padding: 10mm 12mm 10mm; }
  }

  /* Narrow screen only — explicitly scoped to screen so it never fires during print */
  @media screen and (max-width: 240mm) {
    .page { width: 100%; margin: 0; box-shadow: none; }
    .section-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="print-bar">
  <span>Print preview — __MENU_TITLE__</span>
  <button onclick="window.print()">Save as PDF / Print</button>
</div>

<div class="page" id="menu-page">
  <!-- rendered by script below -->
</div>

<script>
var MENU = __MENU_DATA__;

function fmt(p) {
  if (p === '' || p === null || p === undefined) return '';
  var n = parseFloat(p);
  if (isNaN(n)) return String(p); /* e.g. "MP" */
  if (!n) return '';
  return n % 1 === 0 ? String(n) : n.toFixed(2).replace(/\.?0+$/, '');
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Group consecutive sections by layout so they can share a flex row.
   Returns an array of rows, each with { layout, sections[] }          */
function groupSections(sections) {
  var maxPerRow = { half: 2, third: 3 };
  var rows = [], i = 0;
  while (i < sections.length) {
    var layout = sections[i].layout || 'full';
    if (layout === 'full') {
      rows.push({ layout: 'full', sections: [sections[i]] });
      i++;
    } else {
      var max = maxPerRow[layout] || 1;
      var group = [];
      while (i < sections.length && (sections[i].layout || 'full') === layout && group.length < max) {
        group.push(sections[i]);
        i++;
      }
      rows.push({ layout: layout, sections: group });
    }
  }
  return rows;
}

function renderSection(section, showDividers) {
  var html = '<div class="section">';
  html += '<div class="section-header">' + esc(section.name) + '</div>';
  if (showDividers !== false) html += '<hr class="section-rule">';
  if (section.subtitle) {
    html += '<div class="section-subtitle">' + esc(section.subtitle) + '</div>';
  }
  var allergenLabels = { v: 'v', ve: 've', g: 'g' };
  var priceColumns = section.priceColumns || [];
  var multiPrice = priceColumns.length >= 2;
  var cellClass = priceColumns.length >= 3 ? 'item-price-cell wide' : 'item-price-cell';
  var headerCellClass = priceColumns.length >= 3 ? 'price-header-cell wide' : 'price-header-cell';

  if (multiPrice) {
    html += '<div class="price-header-row">';
    priceColumns.forEach(function(col) {
      html += '<span class="' + headerCellClass + '">' + esc(col) + '</span>';
    });
    html += '</div>';
  }

  section.items.forEach(function(item) {
    html += '<div class="item">';
    html += '<span class="item-name">' + esc(item.name);
    var tags = (item.allergens || []).filter(function(a) { return allergenLabels[a]; });
    if (tags.length) {
      html += '<span class="item-allergens">';
      html += '<span class="item-allergen">(' + tags.map(function(a){return allergenLabels[a];}).join(', ') + ')</span>';
      html += '</span>';
    }
    html += '</span>';
    if (multiPrice) {
      var prices = item.prices || [];
      html += '<div class="item-price-group">';
      priceColumns.forEach(function(col, pi) {
        var pStr = fmt(prices[pi]);
        html += '<span class="' + cellClass + '">' + (pStr || '') + '</span>';
      });
      html += '</div>';
    } else {
      var priceStr = fmt(item.price);
      if (priceStr) html += '<span class="item-price">' + priceStr + '</span>';
    }
    html += '</div>';
    if (item.description) {
      html += '<div class="item-note">' + esc(item.description) + '</div>';
    }
  });
  html += '</div>';
  return html;
}

function render(menu) {
  var page = document.getElementById('menu-page');
  var html = '';
  var showDividers = menu.showDividers !== false;
  var logoWidthMm = (menu.logoScale || 62) + 'mm';
  var pageSize = menu.pageSize || 'a4';

  // Apply page size
  if (pageSize === 'a5') page.classList.add('a5');

  // Inject correct @page size for PDF output
  var pageStyle = document.createElement('style');
  pageStyle.textContent = '@page { size: ' + pageSize.toUpperCase() + ' portrait; margin: 0; }';
  document.head.appendChild(pageStyle);

  // Apply body font from settings
  if (menu.meta && menu.meta.bodyFont) {
    document.documentElement.style.setProperty('--font-body', menu.meta.bodyFont);
  }

  /* ── Content area ── */
  var twoCol = menu.pageColumns === 2;
  html += '<div class="page-content' + (twoCol ? ' two-col' : '') + '">';

  // Header
  html += '<div class="header">';
  var logoUrl = menu.meta && menu.meta.logoUrl ? menu.meta.logoUrl : '/assets/herd-brand.png';
  html += '<img src="' + esc(logoUrl) + '" class="brand-logo" style="width:' + logoWidthMm + '" alt="Herd at Todenham Manor Farm">';
  var tagline = menu.meta && menu.meta.tagline;
  if (tagline && tagline.replace(/_/g, '').trim()) {
    html += '<p class="tagline">' + esc(tagline) + '</p>';
  }
  html += '</div>';

  // Print title block (set menu heading, pricing lines, etc.)
  if (menu.printTitle) html += '<p class="menu-title">' + esc(menu.printTitle) + '</p>';
  if (menu.printIntro) html += '<p class="menu-intro">' + esc(menu.printIntro) + '</p>';

  // Sections — in two-col mode render individually; otherwise group by layout
  if (twoCol) {
    (menu.sections || []).forEach(function(s) { html += renderSection(s, showDividers); });
  } else {
    var rows = groupSections(menu.sections || []);
    rows.forEach(function(row) {
      if (row.layout === 'full') {
        html += renderSection(row.sections[0], showDividers);
      } else {
        html += '<div class="section-row">';
        row.sections.forEach(function(s) { html += renderSection(s, showDividers); });
        html += '</div>';
      }
    });
  }

  html += '</div>'; // end .page-content

  /* ── Footer — pinned to bottom by flex ── */
  if (menu.meta && menu.meta.footer) {
    html += '<div class="footer-area">';
    if (showDividers) html += '<hr class="footer-rule">';
    html += '<p class="footer">' + esc(menu.meta.footer) + '</p>';
    html += '</div>';
  }

  page.innerHTML = html;
}

render(MENU);

/* ── Auto-scale: shrink to fit one page if content is too tall ── */
function autoFitPage() {
  var page = document.getElementById('menu-page');
  if (!page) return;

  // Reset any previous scale so we measure the true content height
  page.style.zoom = '';
  page.style.transform = '';
  page.style.transformOrigin = '';

  // Measure page height in px (A4 = 297mm, A5 = 210mm)
  var isA5 = page.classList.contains('a5');
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;height:' + (isA5 ? '210mm' : '297mm') + ';width:0;visibility:hidden;pointer-events:none;';
  document.body.appendChild(probe);
  var pagePx = probe.offsetHeight;
  document.body.removeChild(probe);

  var contentPx = page.scrollHeight;
  if (contentPx <= pagePx + 2) return; // fits, nothing to do

  var ratio = (pagePx / contentPx).toFixed(5);

  // Try zoom first (Chrome/Edge — layout-affecting, ideal for print)
  page.style.zoom = ratio;

  // Re-measure: if zoom worked, scrollHeight will have decreased proportionally.
  // If it didn't shrink (Safari on older engines), fall back to transform.
  if (page.scrollHeight > pagePx + 2) {
    page.style.zoom = '';
    page.style.transformOrigin = 'top center';
    page.style.transform = 'scale(' + ratio + ')';
  }
}

window.addEventListener('load', autoFitPage);
window.addEventListener('beforeprint', autoFitPage);
</script>
</body>
</html>
